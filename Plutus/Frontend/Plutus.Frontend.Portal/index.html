<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Plutus mark. Files live in public/ so Vite copies them to the docroot unhashed. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- manifest.json, not .webmanifest: Caddy has no MIME entry for the latter and
         serves it with an empty Content-Type. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2c698d" />
    <title>Plutus Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
