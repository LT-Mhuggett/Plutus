name: CI

# Backend build + tests for the Plutus platform solution (T0.3).
# NOTE: untested until GitHub Actions is enabled on this repo. Only the platform
# projects in Plutus.slnx build here — the MAUI (Windows/workloads) and web frontends
# are out of this solution by design. Integration tests needing MySQL arrive in Phase 1
# (a MySQL service container gets added then).

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 9.0.x SDK is needed to parse the .slnx solution; it builds the net8 targets fine.
          dotnet-version: |
            8.0.x
            9.0.x

      - run: dotnet restore Plutus.slnx
      - run: dotnet build Plutus.slnx -c Release --no-restore
      - run: dotnet test Plutus.slnx -c Release --no-build --verbosity minimal

  # OpenAPI drift gate — enabled at T1.6 (contract freeze):
  # openapi-drift:
  #   regenerate openapi.json against a booted instance and fail if it differs from the committed copy.
